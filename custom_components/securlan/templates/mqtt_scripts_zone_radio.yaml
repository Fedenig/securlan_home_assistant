script:
    #############################################
    # SCRIPT COMANDI ZONE RADIO VIA MQTT
    # Prefisso mqtt_ per coesistere con REST
    # Generato automaticamente
    #############################################

    #============================================
    # SCRIPT PARAMETRICI
    #============================================
    mqtt_zona_radio_escludi:
      alias: "MQTT Zona Radio - Escludi"
      description: "Escludi zona radio via MQTT (parametrico)"
      fields:
        zona:
          description: "Numero della zona radio"
          example: 1
      sequence:
        - action: mqtt.publish
          data:
            topic: "zona_radio/{{ zona }}/cmd"
            payload: "ESCLUDI"
            qos: 1

    mqtt_zona_radio_includi:
