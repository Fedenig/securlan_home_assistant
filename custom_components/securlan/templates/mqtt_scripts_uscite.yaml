script:
    #############################################
    # SCRIPT COMANDI USCITE VIA MQTT
    # Prefisso mqtt_ per coesistere con REST
    # Generato automaticamente
    #############################################

    #============================================
    # SCRIPT PARAMETRICI
    #============================================
    mqtt_uscita_attiva:
      alias: "MQTT Uscita - Attiva"
      description: "Attiva uscita via MQTT (parametrico)"
      fields:
        uscita:
          description: "Numero dell'uscita"
          example: 1
      sequence:
        - action: mqtt.publish
          data:
            topic: "uscita/{{ uscita }}/cmd"
            payload: "ATTIVA"
            qos: 1

    mqtt_uscita_disattiva:
