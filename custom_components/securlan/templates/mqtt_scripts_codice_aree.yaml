script:
    #############################################
    # SCRIPT COMANDI AREE VIA MQTT
    # Prefisso mqtt_ per coesistere con REST
    # FIX: alarm_code | length > 0 per bloccare invio senza password
    # Generato automaticamente
    #############################################

    #============================================
    # AREA 1
    #============================================
    mqtt_alarm_arm_check_a1:
      alias: "MQTT Area 1 - ON"
      description: "Inserimento Area 1 via MQTT"
      sequence:
        - choose:
            - conditions:
                - condition: template
                  value_template: |
                    {% set alarm_code = states('input_text.alarm_code') %}
                    {% set allowed_codes = states('input_text.password_allarme') %}
                    {{ alarm_code | length > 0 and alarm_code in allowed_codes }}
              sequence:
                - action: input_text.set_value
                  data:
                    entity_id: input_text.alarm_code
                    value: ""
                - action: mqtt.publish
                  data:
                    topic: "area/1/cmd"
                    payload: "ON"
                    qos: 1

