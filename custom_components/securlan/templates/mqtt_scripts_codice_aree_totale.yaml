script:
    #############################################
    # SCRIPT COMANDI TUTTE LE AREE VIA MQTT
    # Sequenzializza le chiamate a tutte le 8 aree
    # FIX: alarm_code | length > 0
    # FIX: delay 600ms tra chiamate MQTT
    #############################################

    ### OFF TOTALE ###
    mqtt_alarm_disarm_check:
      alias: "MQTT Tutte Aree - OFF"
      description: "Disinserimento tutte le aree via MQTT"
      mode: single
      sequence:
        - choose:
            - conditions:
                - condition: template
                  value_template: |
                    {% set alarm_code = states('input_text.alarm_code') %}
                    {% set allowed_codes = states('input_text.password_allarme') %}
                    {{ alarm_code | length > 0 and alarm_code in allowed_codes }}
              sequence:
                - service: input_text.set_value
                  data:
                    entity_id: input_text.alarm_code
                    value: ""
                - service: mqtt.publish
                  data:
                    topic: "area/1/cmd"
                    payload: "OFF"
                - delay:
                    milliseconds: 600
                - service: mqtt.publish
                  data:
                    topic: "area/2/cmd"
                    payload: "OFF"
                - delay:
                    milliseconds: 600
                - service: mqtt.publish
                  data:
                    topic: "area/3/cmd"
                    payload: "OFF"
                - delay:
                    milliseconds: 600
                - service: mqtt.publish
                  data:
                    topic: "area/4/cmd"
                    payload: "OFF"
                - delay:
                    milliseconds: 600
                - service: mqtt.publish
                  data:
                    topic: "area/5/cmd"
                    payload: "OFF"
                - delay:
                    milliseconds: 600
                - service: mqtt.publish
                  data:
                    topic: "area/6/cmd"
                    payload: "OFF"
                - delay:
                    milliseconds: 600
                - service: mqtt.publish
                  data:
                    topic: "area/7/cmd"
                    payload: "OFF"
                - delay:
                    milliseconds: 600
                - service: mqtt.publish
                  data:
                    topic: "area/8/cmd"
                    payload: "OFF"

