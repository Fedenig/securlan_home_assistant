script:
    #############################################
    # SCRIPT COMANDI ZONE FILO VIA MQTT
    # Prefisso mqtt_ per coesistere con REST
    # Generato automaticamente
    #############################################

    #============================================
    # SCRIPT PARAMETRICI
    #============================================
    mqtt_zona_filo_escludi:
      alias: "MQTT Zona Filo - Escludi"
      description: "Escludi zona filo via MQTT (parametrico)"
      fields:
        zona:
          description: "Numero della zona filo"
          example: 1
      sequence:
        - action: mqtt.publish
